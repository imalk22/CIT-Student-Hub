<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CIT Student Hub · Sign in</title>
<link rel="icon" href="assets/emblem.png">
<style>
  :root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--line:rgba(60,60,67,.18);--blue:#007aff;--red:#ff3b30;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:rgba(84,84,88,.6);--blue:#0a84ff;--red:#ff453a;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
  form{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  img{width:56px;height:56px;display:block;margin:0 auto 10px}
  h1{font-size:21px;text-align:center;margin:0 0 4px}
  p{color:var(--muted);text-align:center;font-size:14px;margin:0 0 20px}
  label{font-size:13px;color:var(--muted);font-weight:600}
  input[type=password]{width:100%;margin:6px 0 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
  input[type=password]:focus{outline:2px solid var(--blue);border-color:transparent}
  button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .err{color:var(--red);font-size:14px;text-align:center;margin:0 0 12px;min-height:1px}
</style>
</head>
<body>
<form method="post" action="/api/login">
  <img src="assets/emblem.png" alt="">
  <h1>CIT Student Hub</h1>
  <p>Staff only — sign in to continue</p>
  <div class="err" id="err"></div>
  <label for="pw">Staff password</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
  <input type="hidden" name="next" id="next">
  <button type="submit">Sign in</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("next").value = q.get("next") || "/";
  const e = q.get("e");
  if (e) document.getElementById("err").textContent = e === "setup" ? "The site's staff password isn't set up yet (HUB_PASSWORD in Vercel)." : "Wrong password — try again.";
</script>
</body>
</html>
